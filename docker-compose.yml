services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-agent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: blogdb
    volumes:
      - auto_blog_postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: blog-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # The sole process that executes Google Vertex SDK calls. Every pipeline
  # worker submits requests to vertex_queue and waits for this gateway.
  vertex-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: auto-blog-worker:latest
    container_name: blog-agent-vertex-gateway
    entrypoint: ["/app/docker/worker-entrypoint.sh"]
    command: ["node_modules/.bin/tsx", "workers/vertex-gateway/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_BASE_URL=${LANGFUSE_INTERNAL_BASE_URL:-http://langfuse-web:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local}
      - LANGFUSE_RELEASE=${LANGFUSE_RELEASE:-local}
    depends_on:
      - redis
      - postgres
    restart: always

  # Vertex credentials are supplied as GCP_* environment variables. The
  # worker entrypoint writes them to an ephemeral in-container JSON file for
  # Google auth; no host credential file is mounted or baked into the image.
  scheduler-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: auto-blog-worker:latest
    container_name: blog-agent-scheduler-worker
    command: ["node_modules/.bin/tsx", "workers/scheduler-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  planning-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-planning-worker
    command: ["node_modules/.bin/tsx", "workers/planning-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  outline-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-outline-worker
    command: ["node_modules/.bin/tsx", "workers/outline-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  writing-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-writing-worker
    command: ["node_modules/.bin/tsx", "workers/writing-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  image-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-image-worker
    command: ["node_modules/.bin/tsx", "workers/image-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  # quality-worker calls Vertex (Gemini vision) for the featured-image
  # relevance/appeal check in workers/quality-worker/scorer.ts - it degrades
  # to skipping just that check (not failing the job) if Vertex is
  # unreachable. publish-worker still calls no external API.
  quality-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-quality-worker
    command: ["node_modules/.bin/tsx", "workers/quality-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  publish-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-publish-worker
    command: ["node_modules/.bin/tsx", "workers/publish-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/blogdb?schema=public
    depends_on:
      - redis
      - postgres
    restart: always

  # Local Langfuse v4. This is the sole AI telemetry store for the project;
  # its databases are intentionally separate from the application postgres
  # and redis services above.
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: blog-agent-langfuse-web
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    ports:
      - "3030:3000"
    environment: &langfuse_environment
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3030}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-0f80dd6f8aff3824642f42c0af91d5a02aeadf52877d2e2b95f247cf304d7287}
      SALT: ${LANGFUSE_SALT:-edf63d59e164ce1fd118a27b77dfaf8fb5f23b5a7f6e5de00a1afab031e599f9}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-2e070503ac8da3ae9b3c481493bc7f7399f0670a64a63331b9c15314c35faf08}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-langfusepassword}@langfuse-postgres:5432/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuseclickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-langfuseredis}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_KEY:-langfuseminio}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_KEY:-langfuseminio}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-auto-blog-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Auto-Blog Local}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-auto-blog}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-auto-blog}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Local Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-change-me-local}

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: blog-agent-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse_environment

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: blog-agent-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfusepassword}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: blog-agent-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuseclickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7-alpine
    container_name: blog-agent-langfuse-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:-langfuseredis}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-langfuseredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: blog-agent-langfuse-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_KEY:-langfuseminio}
    volumes:
      - langfuse_minio_data:/data
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Langfuse v4 writes OTEL batches to S3 before the worker ingests them.
  # MinIO does not create buckets automatically, so initialize the bucket
  # once after the object store is healthy.
  langfuse-minio-init:
    image: minio/mc:latest
    container_name: blog-agent-langfuse-minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://langfuse-minio:9000
        ${LANGFUSE_S3_ACCESS_KEY:-langfuse}
        ${LANGFUSE_S3_SECRET_KEY:-langfuseminio}
        && mc mb --ignore-existing local/langfuse

volumes:
  redis_data:
  auto_blog_postgres_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
