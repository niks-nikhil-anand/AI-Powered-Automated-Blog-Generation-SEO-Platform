services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-agent-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blog_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: blog-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # GOOGLE_APPLICATION_CREDENTIALS below is a *host* path from .env - it has
  # to be bind-mounted into each container at a fixed path, and the env var
  # here points at that container path instead, not templated from the host
  # value. An env var alone doesn't make a host file visible inside the
  # container: every Vertex-calling worker was pointing at
  # /Users/.../<file>.json, which doesn't exist in any container, and
  # writing-worker's first real blog-generation call surfaced it as a 30s
  # timeout (google-auth-library's ADC chain hanging on the missing file)
  # followed by three fast "credential file not found" retries. Fixed here
  # rather than relying on the Dockerfile's `COPY . .` accidentally baking
  # the credentials file into the image at a different path - that also
  # means a live service-account key doesn't end up sitting in an image
  # layer, once it's added to .dockerignore.
  research-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-research-worker
    command: ["node_modules/.bin/tsx", "workers/research-worker/index.ts"]
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcp-credentials.json:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - GOOGLE_TRENDS_GEO=${GOOGLE_TRENDS_GEO:-US}
      - RESEARCH_CRON_OVERNIGHT=${RESEARCH_CRON_OVERNIGHT:-30 6 * * *}
      - RESEARCH_CRON_MIDDAY=${RESEARCH_CRON_MIDDAY:-0 14 * * *}
      - RESEARCH_CRON_US_DAYTIME=${RESEARCH_CRON_US_DAYTIME:-30 23 * * *}
      - TIMEZONE=${TIMEZONE:-Asia/Kolkata}
      - TRENDS_TO_WRITE_PER_RUN=${TRENDS_TO_WRITE_PER_RUN:-5}
      - RESEARCH_MAX_SIGNALS_PER_SOURCE=${RESEARCH_MAX_SIGNALS_PER_SOURCE:-25}
      - RESEARCH_MIN_SCORE_TO_PROMOTE=${RESEARCH_MIN_SCORE_TO_PROMOTE:-70}
      - RESEARCH_MIN_SCORE_TO_WRITE=${RESEARCH_MIN_SCORE_TO_WRITE:-90}
      - RESEARCH_SEMANTIC_ENABLED=${RESEARCH_SEMANTIC_ENABLED:-true}
      - RESEARCH_RECENT_DUPLICATE_DAYS=${RESEARCH_RECENT_DUPLICATE_DAYS:-30}
      - RESEARCH_GOOGLE_NEWS_QUERY=${RESEARCH_GOOGLE_NEWS_QUERY:-developer tools OR javascript OR typescript OR ai coding OR open source}
      - RESEARCH_GITHUB_QUERIES=${RESEARCH_GITHUB_QUERIES:-created:>2026-07-01 stars:>100 language:TypeScript,created:>2026-07-01 stars:>100 language:JavaScript,created:>2026-07-01 stars:>100 language:Python}
      - GOOGLE_NEWS_LANGUAGE=${GOOGLE_NEWS_LANGUAGE:-en}
      - GOOGLE_NEWS_COUNTRY=${GOOGLE_NEWS_COUNTRY:-US}
      - RESEARCH_TIMEOUT_MS=${RESEARCH_TIMEOUT_MS:-15000}
      - RESEARCH_RETRY_COUNT=${RESEARCH_RETRY_COUNT:-2}
      - RESEARCH_USER_AGENT=${RESEARCH_USER_AGENT:-Mozilla/5.0 (compatible; AutoBlogResearchBot/1.0)}
      - GOOGLE_AI_BLOG_RSS=${GOOGLE_AI_BLOG_RSS:-}
      - MICROSOFT_AI_BLOG_RSS=${MICROSOFT_AI_BLOG_RSS:-}
      - OPENAI_NEWS_RSS=${OPENAI_NEWS_RSS:-}
      - ANTHROPIC_NEWS_RSS=${ANTHROPIC_NEWS_RSS:-}
      - TECHCRUNCH_AI_RSS=${TECHCRUNCH_AI_RSS:-}
      - TECHCRUNCH_STARTUPS_RSS=${TECHCRUNCH_STARTUPS_RSS:-}
      - THE_VERGE_AI_RSS=${THE_VERGE_AI_RSS:-}
      - NVIDIA_BLOG_RSS=${NVIDIA_BLOG_RSS:-}
      - HACKERNEWS_RSS=${HACKERNEWS_RSS:-}
      - ENABLE_GOOGLE_TRENDS=${ENABLE_GOOGLE_TRENDS:-true}
      - ENABLE_GOOGLE_NEWS=${ENABLE_GOOGLE_NEWS:-true}
      - ENABLE_GITHUB_TRENDING=${ENABLE_GITHUB_TRENDING:-true}
      - ENABLE_TECHCRUNCH=${ENABLE_TECHCRUNCH:-true}
      - ENABLE_THE_VERGE=${ENABLE_THE_VERGE:-true}
      - ENABLE_GOOGLE_AI_BLOG=${ENABLE_GOOGLE_AI_BLOG:-true}
      - ENABLE_OPENAI_NEWS=${ENABLE_OPENAI_NEWS:-true}
      - ENABLE_ANTHROPIC_NEWS=${ENABLE_ANTHROPIC_NEWS:-true}
      - ENABLE_MICROSOFT_AI_BLOG=${ENABLE_MICROSOFT_AI_BLOG:-true}
      - ENABLE_NVIDIA_BLOG=${ENABLE_NVIDIA_BLOG:-true}
      - ENABLE_HACKERNEWS=${ENABLE_HACKERNEWS:-true}
    depends_on:
      - postgres
      - redis
    restart: always

  planning-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-planning-worker
    command: ["node_modules/.bin/tsx", "workers/planning-worker/index.ts"]
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcp-credentials.json:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_FLASH=${VERTEX_FLASH:-gemini-2.5-flash}
    depends_on:
      - postgres
      - redis
    restart: always

  outline-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-outline-worker
    command: ["node_modules/.bin/tsx", "workers/outline-worker/index.ts"]
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcp-credentials.json:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_FLASH=${VERTEX_FLASH:-gemini-2.5-flash}
    depends_on:
      - postgres
      - redis
    restart: always

  writing-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-writing-worker
    command: ["node_modules/.bin/tsx", "workers/writing-worker/index.ts"]
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcp-credentials.json:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-2.5-pro}
      - VERTEX_FLASH=${VERTEX_FLASH:-gemini-2.5-flash}
      - BLOG_MIN_WORDS=${BLOG_MIN_WORDS:-1200}
      - BLOG_MAX_WORDS=${BLOG_MAX_WORDS:-2000}
      - WRITING_TIMEOUT_MS=${WRITING_TIMEOUT_MS:-120000}
    depends_on:
      - postgres
      - redis
    restart: always

  # image-worker calls Imagen via Vertex for the AI hero art (see
  # workers/image-worker/ai-generator.ts), falling back to the local SVG
  # generator when IMAGE_AI_GENERATION_ENABLED is false or Vertex is
  # unreachable, then uploads the result to S3 via the hand-rolled SigV4
  # signer in workers/image-worker/storage.ts. AWS_ACCESS_KEY/AWS_SECRET_KEY/
  # AWS_BUCKET_NAME/AWS_CLOUDFRONT_URL match the shorter names
  # workers/shared/env.ts's optional() fallback chain already reads
  # (AWS_ACCESS_KEY_ID falls back to AWS_ACCESS_KEY, etc.) - use whichever
  # pair your .env actually has, this just has to match it.
  image-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-image-worker
    command: ["node_modules/.bin/tsx", "workers/image-worker/index.ts"]
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcp-credentials.json:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_IMAGE_MODEL=${VERTEX_IMAGE_MODEL:-gemini-2.5-flash-image}
      - IMAGE_AI_GENERATION_ENABLED=${IMAGE_AI_GENERATION_ENABLED:-true}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-}
      - AWS_CLOUDFRONT_URL=${AWS_CLOUDFRONT_URL:-}
    depends_on:
      - postgres
      - redis
    restart: always

  # quality-worker calls Vertex (Gemini vision) for the featured-image
  # relevance/appeal check in workers/quality-worker/scorer.ts - it degrades
  # to skipping just that check (not failing the job) if Vertex is
  # unreachable. publish-worker still calls no external API.
  quality-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-quality-worker
    command: ["node_modules/.bin/tsx", "workers/quality-worker/index.ts"]
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcp-credentials.json:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_FLASH=${VERTEX_FLASH:-gemini-2.5-flash}
    depends_on:
      - postgres
      - redis
    restart: always

  publish-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: blog-agent-publish-worker
    command: ["node_modules/.bin/tsx", "workers/publish-worker/index.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blog_agent?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
