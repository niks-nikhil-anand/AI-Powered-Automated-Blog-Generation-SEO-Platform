services:
  redis:
    image: redis:7-alpine
    container_name: blog-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # The sole process that executes Google Vertex SDK calls. Every pipeline
  # worker submits requests to vertex_queue and waits for this gateway.
  vertex-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: auto-blog-worker:latest
    container_name: blog-agent-vertex-gateway
    entrypoint: ["/app/docker/worker-entrypoint.sh"]
    command: ["node_modules/.bin/tsx", "workers/vertex-gateway/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  # Vertex credentials are supplied as GCP_* environment variables. The
  # worker entrypoint writes them to an ephemeral in-container JSON file for
  # Google auth; no host credential file is mounted or baked into the image.
  research-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: auto-blog-worker:latest
    container_name: blog-agent-research-worker
    command: ["node_modules/.bin/tsx", "workers/research-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  planning-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-planning-worker
    command: ["node_modules/.bin/tsx", "workers/planning-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  outline-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-outline-worker
    command: ["node_modules/.bin/tsx", "workers/outline-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  writing-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-writing-worker
    command: ["node_modules/.bin/tsx", "workers/writing-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  # image-worker calls Imagen via Vertex for the AI hero art (see
  # workers/image-worker/ai-generator.ts), falling back to the local SVG
  # generator when IMAGE_AI_GENERATION_ENABLED is false or Vertex is
  # unreachable, then uploads the result to S3 via the hand-rolled SigV4
  # signer in workers/image-worker/storage.ts. AWS_ACCESS_KEY/AWS_SECRET_KEY/
  # AWS_BUCKET_NAME/AWS_CLOUDFRONT_URL match the shorter names
  # workers/shared/env.ts's optional() fallback chain already reads
  # (AWS_ACCESS_KEY_ID falls back to AWS_ACCESS_KEY, etc.) - use whichever
  # pair your .env actually has, this just has to match it.
  image-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-image-worker
    command: ["node_modules/.bin/tsx", "workers/image-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  # quality-worker calls Vertex (Gemini vision) for the featured-image
  # relevance/appeal check in workers/quality-worker/scorer.ts - it degrades
  # to skipping just that check (not failing the job) if Vertex is
  # unreachable. publish-worker still calls no external API.
  quality-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-quality-worker
    command: ["node_modules/.bin/tsx", "workers/quality-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  publish-worker:
    image: auto-blog-worker:latest
    container_name: blog-agent-publish-worker
    command: ["node_modules/.bin/tsx", "workers/publish-worker/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  # Optional self-hosted SearXNG instance for the research engine's SERP
  # discovery + validation layer (docs/RESEARCH_ENGINE_UPGRADE.md). It runs
  # under the "searxng" compose profile so it does NOT start with a plain
  # `docker compose up` - start it explicitly with:
  #   docker compose --profile searxng up -d searxng
  # then set SEARXNG_ENABLED=true / ENABLE_SEARXNG=true on the research-worker.
  # The mounted settings.yml enables SearXNG's JSON API (format=json), which
  # stock SearXNG images disable by default - the worker's client needs it.
  searxng:
    image: searxng/searxng:latest
    container_name: blog-agent-searxng
    profiles: ["searxng"]
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_PUBLIC_URL:-http://localhost:8080/}
    restart: unless-stopped

volumes:
  redis_data:
